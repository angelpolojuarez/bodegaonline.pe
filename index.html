// ===== EXPORTAR EXCEL (.xlsx real, sin librerías) =====
const crcT=(()=>{let t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

const colL=i=>String.fromCharCode(65+i);

const T={

function pedirProv(){const l=low();if(!l.length)return toast('No hay productos bajo el mínimo');window.open('https://wa.me/?text='+encodeURIComponent('Hola, necesito reponer:\n'+l.map(p=>`- ${p.name}: ${Math.max(p.min*3-p.stock,1)} und.`).join('\n')+'\nGracias. Bodega Don Carlos'))}
// ===== VENTAS =====
V.ventas=()=>`<div class="g g2"><div class="card"><h2>Buscar producto</h2><input id="q" placeholder="Nombre o categoría…" oninput="plist()"><div class="pl" id="pl" style="margin-top:10px"></div></div><div class="card"><h2>Venta actual</h2><div id="cart"></div></div></div>`;
A.ventas=()=>{plist();rcart()};
function plist(){const q=($('#q')?.value||'').toLowerCase();$('#pl').innerHTML=DB.prods.filter(p=>(p.name+p.cat).toLowerCase().includes(q)).map(p=>`<div class="pi ${p.stock<=0?'x':''}" onclick="addC(${p.id})"><b>${E(p.name)}</b>${S(p.price)}<br><span class="tag ${p.stock<=0?'tr':p.stock<=p.min?'to':'tg'}">Stock ${p.stock}</span></div>`).join('')||'<p style="color:var(--m)">Sin resultados</p>'}
function addC(id){const p=P(id),c=cart.find(x=>x.id==id);if(p.stock<=0)return toast('Sin stock');if(c){if(c.qty>=p.stock)return toast('No hay más stock');c.qty++}else cart.push({id,qty:1});rcart()}
function qC(id,d){const c=cart.find(x=>x.id==id),p=P(id);c.qty+=d;if(c.qty>p.stock){c.qty=p.stock;toast('Stock máximo')}if(c.qty<=0)cart=cart.filter(x=>x.id!=id);rcart()}
const ctot=()=>cart.reduce((a,c)=>a+P(c.id).price*c.qty,0);
function rcart(){$('#cart').innerHTML=cart.length?`<table>${cart.map(c=>{const p=P(c.id);return`<tr><td>${E(p.name)}</td><td><button class="b s n" onclick="qC(${c.id},-1)">−</button> ${c.qty} <button class="b s n" onclick="qC(${c.id},1)">+</button></td><td>${S(p.price*c.qty)}</td></tr>`}).join('')}</table><p class="tot">Total: ${S(ctot())}</p><label>Método de pago</label><select id="pm"><option>Efectivo</option><option>Yape</option></select><label>Efectivo recibido (opcional, para el vuelto)</label><input id="rc" type="number" step="0.01" inputmode="decimal" oninput="vuelto()"><p id="vu" style="margin:6px 0 0;font-weight:700"></p><div class="row" style="margin-top:10px"><button class="b" onclick="cobrar()">✔ Cobrar y registrar</button><button class="b r" onclick="cart=[];rcart()">Vaciar</button></div>`:'<p style="color:var(--m)">Toca un producto para agregarlo.</p>'}
function mkSale(items,method,cust){for(const i of items)if(!P(i.id)||P(i.id).stock<i.qty){toast('Stock insuficiente: '+(P(i.id)?.name||'producto'));return null}
const s={id:Date.now(),date:td(),time:new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}),method,cust:cust||'',by:me?.u||'',items:items.map(i=>{const p=P(i.id);p.stock-=i.qty;DB.moves.unshift({date:td(),pid:p.id,name:p.name,type:'Venta',qty:-i.qty});return{id:p.id,name:p.name,price:p.price,cost:p.cost,qty:i.qty}})};s.total=s.items.reduce((a,i)=>a+i.price*i.qty,0);DB.sales.push(s);save();return s}
const vuelto=()=>{const r=+$("#rc").value,t=ctot();$("#vu").innerHTML=r>0?(r>=t?'Vuelto: <span style="color:var(--t)">'+S(r-t)+'</span>':'<span style="color:var(--r)">Faltan '+S(t-r)+'</span>'):''};
function cobrar(){const s=mkSale(cart,$('#pm').value);if(!s)return;cart=[];ticket(s);A.ventas()}
function ticket(s){openM(`<h2>🧾 Boleta Bodega Don Carlos</h2><small>${s.date} ${s.time} · ${s.method}${s.by?' · '+E(s.by):''}</small><table>${s.items.map(i=>`<tr><td>${i.qty}× ${E(i.name)}</td><td>${S(i.price*i.qty)}</td></tr>`).join('')}</table><p class="tot">Total ${S(s.total)}</p><div class="row np"><button class="b n" onclick="window.print()">Imprimir</button><button class="b" onclick="closeM()">Cerrar</button></div>`)}
// ===== INVENTARIO =====
V.inv=()=>`<div class="card"><h2>Inventario digital <span id="ic2" style="color:var(--m);font-size:13px;font-weight:400"></span></h2><div class="row np"><input id="iq" placeholder="Búsqueda rápida…" oninput="itab()"><select id="ic" onchange="itab()"><option value="">Todas</option>${[...new Set(DB.prods.map(p=>p.cat))].map(c=>`<option>${E(c)}</option>`).join('')}<option value="__low">Solo stock bajo</option></select><button class="b" onclick="fProd()">+ Nuevo</button><button class="b x" onclick="expOne('inv','Inventario')">⬇ Excel</button></div><div class="tw"><table><thead><tr><th>Producto</th><th>Cat.</th><th>Precio</th><th>Stock</th><th>Vence</th><th class="np">Acciones</th></tr></thead><tbody id="it"></tbody></table></div></div>
<div class="card mt"><div class="row"><h3 style="flex:1;margin:0">Movimientos <span id="mc" style="color:var(--m);font-weight:400"></span></h3><select id="ml" onchange="itab()" style="width:auto"><option value="15">Últimos 15</option><option value="100">Últimos 100</option><option value="0">Todos</option></select><button class="b x s np" onclick="expOne('mov','Movimientos')">⬇ Excel</button></div><div class="tw"><table id="mv"></table></div></div>`;
A.inv=()=>itab();
function itab(){const q=($('#iq')?.value||'').toLowerCase(),c=$('#ic')?.value||'';const fl=DB.prods.filter(p=>(p.name+p.cat).toLowerCase().includes(q)&&(!c||(c=='__low'?p.stock<=p.min:p.cat==c)));$('#ic2').textContent='('+fl.length+' de '+DB.prods.length+')';$('#it').innerHTML=DB.prods.filter(p=>(p.name+p.cat).toLowerCase().includes(q)&&(!c||(c=='__low'?p.stock<=p.min:p.cat==c))).map(p=>`<tr><td>${E(p.name)}</td><td>${E(p.cat)}</td><td>${S(p.price)}</td><td><span class="tag ${p.stock<=0?'tr':p.stock<=p.min?'to':'tg'}">${p.stock}</span></td><td>${p.exp||'-'}${p.exp&&dias(p)<=30?' ⚠️':''}</td><td class="np"><button class="b s" onclick="fMov(${p.id},'Entrada')">+Entrada</button> <button class="b s o" onclick="fMov(${p.id},'Salida')">−Salida</button> <button class="b s n" onclick="fProd(${p.id})">Editar</button> <button class="b s r" onclick="delP(${p.id})">✕</button></td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--m)">Sin productos</td></tr>';
const ml=+($('#ml')?.value||15),mv=ml?DB.moves.slice(0,ml):DB.moves;$('#mc').textContent='('+mv.length+' de '+DB.moves.length+')';$('#mv').innerHTML='<tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th></tr>'+(mv.map(m=>`<tr><td>${m.date}</td><td>${E(m.name)}</td><td>${E(m.type)}</td><td>${m.qty>0?'+':''}${m.qty}</td></tr>`).join('')||'<tr><td colspan="4" style="color:var(--m)">Sin movimientos</td></tr>')}
function fProd(id){const p=id?P(id):{name:'',cat:'Abarrotes',price:'',cost:'',stock:0,min:5,exp:''};openM(`<h2>${id?'Editar':'Nuevo'} producto</h2><label>Nombre</label><input id="f1" value="${E(p.name)}"><label>Categoría</label><input id="f2" value="${E(p.cat)}"><label>Precio venta (S/)</label><input id="f3" type="number" step="0.01" value="${p.price}"><label>Costo (S/)</label><input id="f4" type="number" step="0.01" value="${p.cost}"><label>Stock</label><input id="f5" type="number" value="${p.stock}"><label>Stock mínimo</label><input id="f6" type="number" value="${p.min}"><label>Vencimiento</label><input id="f7" type="date" value="${p.exp}"><div class="row" style="margin-top:12px"><button class="b" onclick="sProd(${id||0})">Guardar</button><button class="b r" onclick="closeM()">Cancelar</button></div>`)}
function sProd(id){const v=i=>$('#f'+i).value,o={name:v(1).trim(),cat:v(2).trim()||'Otros',price:+v(3),cost:+v(4),stock:+v(5),min:+v(6),exp:v(7)};if(!o.name||!(o.price>0))return toast('Completa nombre y precio');if(id)Object.assign(P(id),o);else DB.prods.push({id:DB.cfg.nid++,...o});save();closeM();go('inv');toast('Producto guardado')}
function delP(id){if(confirm('¿Eliminar producto?')){DB.prods=DB.prods.filter(p=>p.id!=id);save();go('inv')}}
function fMov(id,t){const p=P(id);openM(`<h2>${t} · ${E(p.name)}</h2><p>Stock actual: <b>${p.stock}</b></p><label>Cantidad</label><input id="mq" type="number" min="1" value="1">${t=='Salida'?'<label>Motivo</label><select id="mr"><option>Merma</option><option>Vencido</option><option>Ajuste</option></select>':'<label>Proveedor / nota</label><input id="mr" placeholder="Opcional">'}<div class="row" style="margin-top:12px"><button class="b" onclick="sMov(${id},'${t}')">Registrar</button><button class="b r" onclick="closeM()">Cancelar</button></div>`)}
function sMov(id,t){const p=P(id),q=Math.floor(+$('#mq').value);if(!(q>0))return toast('Cantidad inválida');if(t=='Salida'&&q>p.stock)return toast('Supera el stock');p.stock+=t=='Entrada'?q:-q;DB.moves.unshift({date:td(),pid:id,name:p.name,type:t+' ('+($('#mr').value||'-')+')',qty:t=='Entrada'?q:-q});save();closeM();go('inv');toast('Movimiento registrado')}
// ===== CATÁLOGO / PEDIDOS =====
V.wa=()=>`<div class="g g2"><div class="card"><h2>📱 Catálogo para clientes</h2><input id="wq" placeholder="Buscar producto…" oninput="wlist()"><div class="pl" id="wl" style="margin-top:10px"></div></div><div class="card"><h2>Pedido del cliente</h2><div id="wc"></div>${isA()?`<hr style="border:0;border-top:1px solid var(--b)"><label>WhatsApp de la bodega (con 51)</label><input id="ph" value="${E(DB.cfg.phone)}" onchange="DB.cfg.phone=this.value.replace(/\\D/g,'');save()">`:''}</div></div>
<div class="card mt"><div class="row"><h2 style="flex:1;margin:0">Pedidos recibidos (${DB.orders.length})</h2><button class="b x s np" onclick="expOne('ped','Pedidos')">⬇ Excel</button></div><div class="tw"><table id="od"></table></div></div>`;
A.wa=()=>{wlist();wcart();odl()};
function wlist(){const q=($('#wq')?.value||'').toLowerCase();$('#wl').innerHTML=DB.prods.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<div class="pi ${p.stock<=0?'x':''}" onclick="addW(${p.id})"><b>${E(p.name)}</b>${S(p.price)}<br><span class="tag ${p.stock>0?'tg':'tr'}">${p.stock>0?'Disponible':'Agotado'}</span></div>`).join('')}
function addW(id){if(P(id).stock<=0)return toast('Agotado');const c=ccart.find(x=>x.id==id);if(c){if(c.qty<P(id).stock)c.qty++}else ccart.push({id,qty:1});wcart()}
function qW(id,d){const c=ccart.find(x=>x.id==id);c.qty+=d;if(c.qty>P(id).stock)c.qty=P(id).stock;if(c.qty<=0)ccart=ccart.filter(x=>x.id!=id);wcart()}
function wcart(){const t=ccart.reduce((a,c)=>a+P(c.id).price*c.qty,0);$('#wc').innerHTML=ccart.length?`<table>${ccart.map(c=>`<tr><td>${E(P(c.id).name)}</td><td><button class="b s n" onclick="qW(${c.id},-1)">−</button> ${c.qty} <button class="b s n" onclick="qW(${c.id},1)">+</button></td><td>${S(P(c.id).price*c.qty)}</td></tr>`).join('')}</table><p class="tot">${S(t)}</p><label>Nombre del cliente</label><input id="cn"><label>Dirección / recojo</label><input id="ca" placeholder="Av. Perú 123 o 'recojo en tienda'"><div class="row" style="margin-top:10px"><button class="b w" onclick="sendW()">Enviar pedido por WhatsApp</button><button class="b r" onclick="ccart=[];wcart()">Vaciar</button></div>`:'<p style="color:var(--m)">Agrega productos al pedido.</p>'}
function sendW(){const n=$('#cn').value.trim(),a=$('#ca').value.trim();if(!n)return toast('Escribe el nombre');const o={id:Date.now(),date:td(),cust:n,addr:a,items:ccart.map(c=>({...c})),st:'Pendiente'};o.total=o.items.reduce((s,c)=>s+P(c.id).price*c.qty,0);DB.orders.unshift(o);save();window.open(`https://wa.me/${DB.cfg.phone}?text=`+encodeURIComponent(`Hola Bodega Don Carlos, soy ${n}. Quiero:\n`+o.items.map(c=>`- ${c.qty} × ${P(c.id).name}`).join('\n')+`\nTotal: ${S(o.total)}\nEntrega: ${a||'por coordinar'}`));ccart=[];A.wa()}
function odl(){$('#od').innerHTML='<tr><th>Fecha</th><th>Cliente</th><th>Detalle</th><th>Total</th><th>Estado</th><th class="np"></th></tr>'+(DB.orders.map(o=>`<tr><td>${o.date}</td><td>${E(o.cust)}</td><td>${o.items.map(i=>i.qty+'× '+E(P(i.id)?.name||'?')).join(', ')}</td><td>${S(o.total)}</td><td><span class="tag ${o.st=='Entregado'?'tg':'to'}">${o.st}</span></td><td class="np">${o.st=='Pendiente'?`<button class="b s" onclick="entr(${o.id})">Entregar y cobrar</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--m)">Sin pedidos aún.</td></tr>')}
function entr(id){const o=DB.orders.find(x=>x.id==id);openM(`<h2>Entregar pedido de ${E(o.cust)}</h2><p class="tot">${S(o.total)}</p><label>Método de pago</label><select id="em"><option>Efectivo</option><option>Yape</option></select><div class="row" style="margin-top:12px"><button class="b" onclick="okEntr(${id})">Confirmar</button><button class="b r" onclick="closeM()">Cancelar</button></div>`)}
function okEntr(id){const o=DB.orders.find(x=>x.id==id),s=mkSale(o.items,$('#em').value,o.cust);if(!s)return;o.st='Entregado';save();closeM();odl();toast('Pedido entregado y descontado del stock')}
// ===== CAJA =====
const cajaDia=()=>{const ss=sToday();return{ef:sum(ss.filter(s=>s.method=='Efectivo')),ya:sum(ss.filter(s=>s.method=='Yape'))}};
V.caja=()=>{const c=cajaDia();return`<div class="g g2"><div class="card"><h2>💰 Cierre de caja de hoy</h2><p>Efectivo esperado: <b>${S(c.ef)}</b><br>Yape esperado: <b>${S(c.ya)}</b><br>Total vendido: <b>${S(c.ef+c.ya)}</b></p><label>Efectivo contado (S/)</label><input id="ce" type="number" step="0.01" oninput="dif()"><label>Yape recibido según tu app (S/)</label><input id="cy" type="number" step="0.01" oninput="dif()"><p id="df" class="tot"></p><button class="b" onclick="cerrar()">Cerrar caja</button></div>
<div class="card"><div class="row"><h2 style="flex:1;margin:0">Historial de cierres (${DB.closes.length})</h2><button class="b x s np" onclick="expOne('caj','Cierres')">⬇ Excel</button></div><div class="tw"><table><tr><th>Fecha</th><th>Esperado</th><th>Contado</th><th>Diferencia</th></tr>${DB.closes.map(x=>`<tr><td>${x.date}</td><td>${S(x.exp)}</td><td>${S(x.got)}</td><td style="color:${Math.abs(x.diff)<.01?'var(--t)':'var(--r)'}">${S(x.diff)}</td></tr>`).join('')||'<tr><td colspan="4" style="color:var(--m)">Sin cierres.</td></tr>'}</table></div></div></div>`};
function dif(){const c=cajaDia(),d=(+$('#ce').value+ +$('#cy').value)-(c.ef+c.ya);$('#df').innerHTML=`Diferencia: <span style="color:${Math.abs(d)<.01?'var(--t)':'var(--r)'}">${S(d)}</span> ${Math.abs(d)<.01?'✅ Cuadra':'⚠️ Revisar'}`}
function cerrar(){const c=cajaDia();if($('#ce').value===''||$('#cy').value==='')return toast('Ingresa efectivo y Yape');const got=+$('#ce').value+ +$('#cy').value;DB.closes.unshift({date:td(),exp:c.ef+c.ya,got,diff:got-(c.ef+c.ya)});save();go('caja');toast('Caja cerrada')}
// ===== REPORTES =====
let rf='',rt='';
V.rep=()=>{const all=sum(DB.sales),inv=DB.prods.reduce((a,p)=>a+p.stock*p.cost,0),ss=sToday();return`<div class="g g4"><div class="card k"><b>${S(sum(ss))}</b><span>Ventas del día</span></div><div class="card k"><b>${S(gan(ss))}</b><span>Ganancia del día</span></div><div class="card k"><b>${S(all)}</b><span>Ventas acumuladas</span></div><div class="card k"><b>${S(inv)}</b><span>Valor del inventario (costo)</span></div></div>
<div class="card mt"><h2>📈 Historial de ventas</h2><div class="row np"><label style="margin:0">Desde</label><input type="date" id="rf" value="${rf}" onchange="rf=this.value;rtab()"><label style="margin:0">Hasta</label><input type="date" id="rt" value="${rt}" onchange="rt=this.value;rtab()"><button class="b n" onclick="rf=rt='';go('rep')">Ver todo</button><button class="b x" onclick="xlsx('Bodega_Ventas',{Ventas:T.ven(rsales()),Resumen_por_dia:T.dia(rsales())})">⬇ Excel (lo filtrado)</button><button class="b n" onclick="window.print()">Imprimir</button></div><p id="rs" class="tot"></p><div class="tw"><table id="rv"></table></div></div>
<div class="card mt np"><h2>🗂 Datos del sistema</h2><div class="row"><button class="b x" onclick="expTodo()">⬇ Exportar TODO a Excel</button><button class="b n" onclick="backup()">Copia de seguridad (.json)</button><button class="b o" onclick="$('#rj').click()">Restaurar copia</button><button class="b r" onclick="if(confirm('¿Borrar TODOS los datos y volver a los de ejemplo?')){localStorage.removeItem('bol');location.reload()}">Reiniciar datos</button></div><input type="file" id="rj" accept=".json" style="display:none" onchange="restore(this.files[0])"></div>`};
A.rep=()=>rtab();
const rsales=()=>DB.sales.filter(s=>(!rf||s.date>=rf)&&(!rt||s.date<=rt));
function rtab(){const ss=rsales();$('#rs').innerHTML=`${ss.length} de ${DB.sales.length} ventas · ${S(sum(ss))} · ganancia ${S(gan(ss))}`;$('#rv').innerHTML='<tr><th>Fecha</th><th>Hora</th><th>Método</th><th>Detalle</th><th>Total</th><th class="np"></th></tr>'+(ss.slice().reverse().map(s=>`<tr><td>${s.date}</td><td>${s.time}</td><td>${s.method}</td><td>${s.items.map(i=>i.qty+'× '+E(i.name)).join(', ')}</td><td>${S(s.total)}</td><td class="np"><button class="b s r" onclick="anular(${s.id})">Anular</button></td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--m)">Sin ventas en el rango.</td></tr>')}
function anular(id){if(!confirm('¿Anular esta venta y devolver el stock?'))return;const s=DB.sales.find(x=>x.id==id);s.items.forEach(i=>{const p=P(i.id);if(p){p.stock+=i.qty;DB.moves.unshift({date:td(),pid:p.id,name:p.name,type:'Anulación de venta',qty:i.qty})}});DB.sales=DB.sales.filter(x=>x.id!=id);save();go('rep');toast('Venta anulada')}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='bodegaonline_copia_'+td()+'.json';a.click();DB.cfg.lb=td();save();toast('Copia descargada ✅')}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.prods||!d.sales)throw 0;DB=d;DB.users=DB.users||seedU();save();toast('Copia restaurada');start(DB.users.find(u=>u.u==me.u)||DB.users[0])}catch(e){toast('Archivo no válido')}};r.readAsText(f)}
// ===== USUARIOS =====
V.usr=()=>`<div class="card"><div class="row"><h2 style="flex:1;margin:0">Usuarios del sistema</h2><button class="b" onclick="fUsr()">+ Nuevo usuario</button></div><div class="tw"><table><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th></th></tr>${DB.users.map(u=>`<tr><td>${E(u.u)}</td><td>${E(u.n)}</td><td><span class="tag ${u.r=='admin'?'tg':'to'}">${u.r=='admin'?'Administrador':'Cajero'}</span></td><td><button class="b s n" onclick="fUsr('${E(u.u)}')">Editar</button> ${u.u!=me.u?`<button class="b s r" onclick="delU('${E(u.u)}')">✕</button>`:''}</td></tr>`).join('')}</table></div></div>`;
function fUsr(u){const x=u?DB.users.find(z=>z.u==u):{u:'',n:'',r:'cajero'};openM(`<h2>${u?'Editar':'Nuevo'} usuario</h2><label>Usuario</label><input id="u1" value="${E(x.u)}" ${u?'disabled':''}><label>Nombre</label><input id="u2" value="${E(x.n)}"><label>Rol</label><select id="u3"><option value="cajero" ${x.r=='cajero'?'selected':''}>Cajero (ventas, pedidos, caja)</option><option value="admin" ${x.r=='admin'?'selected':''}>Administrador (todo)</option></select><label>Contraseña ${u?'(vacío = no cambiar)':''}</label><input id="u4" type="password"><div class="row" style="margin-top:12px"><button class="b" onclick="sUsr('${E(u||'')}')">Guardar</button><button class="b r" onclick="closeM()">Cancelar</button></div>`)}
function sUsr(u){const n=$('#u2').value.trim(),r=$('#u3').value,pw=$('#u4').value;if(!n)return toast('Escribe el nombre');
if(u){const x=DB.users.find(z=>z.u==u);if(u==me.u&&r!='admin'&&DB.users.filter(z=>z.r=='admin').length<2)return toast('Debe quedar un administrador');x.n=n;x.r=r;if(pw){if(pw.length<6)return toast('Mínimo 6 caracteres');x.h=hs(pw)}if(u==me.u)me=x}
else{const nu=$('#u1').value.trim().toLowerCase();if(!/^[a-z0-9_.]{3,}$/.test(nu))return toast('Usuario: mín. 3 letras/números');if(DB.users.some(z=>z.u==nu))return toast('Ese usuario ya existe');if(pw.length<6)return toast('Contraseña mínimo 6 caracteres');DB.users.push({u:nu,n,r,h:hs(pw)})}
save();closeM();start(me);go('usr');toast('Usuario guardado')}
function delU(u){if(confirm('¿Eliminar usuario '+u+'?')){DB.users=DB.users.filter(x=>x.u!=u);save();go('usr')}}
// ===== ARRANQUE =====
(()=>{let s=null;try{s=localStorage.getItem('bol_s')||sessionStorage.getItem('bol_s')}catch(e){}const x=DB.users.find(u=>u.u==s);if(x)start(x);else $('#lg').style.display='flex'})();
</script></body></html>
